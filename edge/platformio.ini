; PlatformIO configuration for Thiết bị biên (ESP32-S3 + OV2640 + PSRAM)
[env:esp32s3_edge]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; Bật PSRAM (kiểm tra OPI hay QSPI tùy board thực tế: qio_opi cho N16R8, qio_qspi cho một số board R2)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB_ota.csv

build_flags =
  -I../common
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Bật macro dưới đây sau khi đã cài thư viện TFLite Micro và export model_data.h:
  ; -DUSE_TFLITE_MICRO

lib_deps =
  bblanchon/ArduinoJson@^7.2.0
  knolleary/PubSubClient@^2.8
  ; Thư viện TinyML gợi ý (chốt phiên bản thực tế ở README sau Tuần 12):
  ; spaziochirale/Chirale_TensorFlowLite@^2.0.0
