; PlatformIO configuration for Node (YoloUNO - ESP32-S3)
[env:yolouno_node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

build_flags =
  -I../common
  -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
  adafruit/Adafruit NeoPixel@^1.12.3
  madhephaestus/ESP32Servo@^3.0.5
  ; Uncomment for N03 LVGL gate display:
  ; lvgl/lvgl@^8.3.11
